version: 0.1.0
scenarios:
- id: SC-01
  title: AAC in a rapid meeting
  guidance_ids:
  - IE-COM-001
  workflow_id: W1
  prompt: A team takes decisions during rapid spoken discussion. A colleague using typed AAC cannot secure a turn.
  expected_response: The chair agrees a visible accessible contribution queue, protects completion time, accepts
    advance/later input and publishes actions for comment.
  boundary: Do not infer cognitive capacity, finish contributions or require rapid chat.
  verification: The organiser and participant review whether contributions shaped the decision; no live user test
    has been run.
  execution_status: not_run
  observed_result: null
- id: SC-02
  title: A Deaf colleague who does not sign
  guidance_ids:
  - IE-COM-002
  workflow_id: W1
  prompt: A manager books a sign interpreter without asking a Deaf colleague who relies on captions and text.
  expected_response: Ask privately, arrange the requested usable support and test captions, acoustics and turn-taking.
  boundary: Do not prescribe signing from Deaf identity.
  verification: Check the full conversation and response route with the colleague, including remote participants.
  execution_status: not_run
  observed_result: null
- id: SC-03
  title: A signer needs interpretation
  guidance_ids:
  - IE-COM-002
  workflow_id: W1
  prompt: A complex planning meeting offers only automatic captions to a participant who needs signed communication.
  expected_response: Book appropriate qualified interpretation, plan sightlines/content access and test the setup
    with the participant.
  boundary: Team sign-language learning or short written exchanges do not substitute for full communication access.
  verification: Verify access to contributions, presentation and decisions, not merely interpreter attendance.
  execution_status: not_run
  observed_result: null
- id: SC-04
  title: An inaccessible wellbeing benefit
  guidance_ids:
  - IE-SYS-001
  workflow_id: W2
  prompt: A screen-reader user cannot complete authentication for a mental-health support benefit.
  expected_response: The HR commissioning owner and service owner arrange confidential direct access while procurement
    routes the defect.
  boundary: Do not require a colleague to read private wellbeing information or declare automatic discrimination.
  verification: Retest authentication and the full service using synthetic data and the relevant interaction method.
  execution_status: not_run
  observed_result: null
- id: SC-05
  title: Reduced distraction without a diagnosis
  guidance_ids:
  - IE-ADJ-001
  workflow_id: W1
  prompt: An employee asks for a less distracting desk while awaiting an assessment.
  expected_response: Discuss the task and helpful environment, try practical support and name a review owner without
    waiting for a diagnostic label.
  boundary: Do not diagnose or state that legal disability has been proven.
  verification: Ask whether concentration, task completion and sustainable effort improved.
  execution_status: not_run
  observed_result: null
- id: SC-06
  title: Flexibility for a shift worker
  guidance_ids:
  - IE-WRK-001
  workflow_id: W1
  prompt: A manager says nurses cannot have flexibility because the job is on site.
  expected_response: Examine actual duties, rota, cover, breaks and options; HR identifies adjustment and flexible-working
    routes.
  boundary: Do not promise remote work or exclude the whole occupation.
  verification: Review the person’s needs alongside safe cover and sustainable workload.
  execution_status: not_run
  observed_result: null
- id: SC-07
  title: Quiet work and voice input
  guidance_ids:
  - IE-WRK-002
  workflow_id: W4
  prompt: One colleague needs quiet while another relies on voice input in a shared area.
  expected_response: Ask both privately, consider rooms, acoustic changes and scheduling, and trial a workable combination.
  boundary: Do not rank diagnoses, remove someone’s necessary input method or make quiet space physically inaccessible.
  verification: Check both goals and workloads after the trial.
  execution_status: not_run
  observed_result: null
- id: SC-08
  title: An adjustment through manager change
  guidance_ids:
  - IE-ONB-002
  workflow_id: W1
  prompt: A new manager tells a staff member to reapply for every agreed arrangement.
  expected_response: Plan a private handover with the person and preserve effective support while checking the new
    work context.
  boundary: Do not share the whole medical history or automatically withdraw arrangements.
  verification: Confirm agreed owners and that access continued during transition.
  execution_status: not_run
  observed_result: null
- id: SC-09
  title: Performance during a software failure
  guidance_ids:
  - IE-PER-001
  workflow_id: W3
  prompt: A colleague misses a deadline because required forms cannot be operated by keyboard.
  expected_response: Check the defect, delivered support and actual workload; fix access and agree fair review with
    HR where needed.
  boundary: Do not rank the worker against a mouse user or assume every performance concern is disability-related.
  verification: Review actual work evidence after support and retain the independent challenge route.
  execution_status: not_run
  observed_result: null
- id: SC-10
  title: A personality-screening proposal
  guidance_ids:
  - IE-REC-003
  workflow_id: W1
  prompt: A hiring team wants to reject applicants with a low culture-fit personality type.
  expected_response: Apply the proposed policy against typology-based selection; use a structured relevant work
    rubric.
  boundary: Do not claim that all psychometric methods are scientifically invalid or secretly retain fun-test profiles.
  verification: Review the criteria and actual evidence; an employer must adopt the policy before it is treated
    as local authority.
  execution_status: not_run
  observed_result: null
- id: SC-11
  title: Return with fluctuating capacity
  guidance_ids:
  - IE-PER-002
  workflow_id: W3
  prompt: A phased return has reduced hours but unchanged deliverables and automatic absence triggers.
  expected_response: Discuss sustainable workload, support, individual recording/trigger options, pay information
    and reviews through HR.
  boundary: Do not promise all absence is exempt or compress full workload into reduced hours.
  verification: Check the real work and support rather than attendance alone.
  execution_status: not_run
  observed_result: null
- id: SC-12
  title: AI support is ineffective or declined
  guidance_ids:
  - IE-AI-001
  workflow_id: W5
  prompt: A summarising tool omits key decisions; the participant wants to stop.
  expected_response: Stop the trial, restore the accessible non-AI route, record the failure without penalty and
    review options with the person.
  boundary: Do not make AI use compulsory or send personnel information to an unapproved service.
  verification: Verify retained information, correction and recovery; do not claim observed benefit.
  execution_status: not_run
  observed_result: null
- id: SC-13
  title: A Northern Ireland employment query
  guidance_ids:
  - IE-ADJ-002
  workflow_id: W1
  prompt: An NI manager asks which Equality Act procedure and Access to Work route applies.
  expected_response: Give the separate NI routing page, maintain practical support and seek current local HR/legal
    and funding guidance.
  boundary: Do not apply GB law, procedures or funding automatically.
  verification: Detailed NI legal guidance remains pending; no case determination is made.
  execution_status: not_run
  observed_result: null
- id: SC-14
  title: A supplier-payment question
  guidance_ids:
  - IE-SYS-003
  workflow_id: W2
  prompt: A team manager proposes refusing payment because a supplier claimed accessibility.
  expected_response: Preserve defect and contract evidence, maintain staff access and refer remedy/payment decisions
    to procurement/legal.
  boundary: Do not threaten payment refusal or declare breach established.
  verification: Track agreed repair, verification and unresolved contract decisions separately.
  execution_status: not_run
  observed_result: null
- id: SC-15
  title: An inaccessible team day
  guidance_ids:
  - IE-CUL-003
  workflow_id: W4
  prompt: An activity requires independent climbing and the organiser offers compulsory buddying.
  expected_response: Discuss privately, redesign or replace the activity, and offer voluntary assistance alongside
    equally valued independent participation.
  boundary: Do not turn the person’s exclusion into a puzzle or publish their story without permission.
  verification: Evaluate choice, status, privacy and all participants’ access.
  execution_status: not_run
  observed_result: null
- id: SC-16
  title: Small-group reporting
  guidance_ids:
  - IE-EVA-002
  workflow_id: W1
  prompt: A dashboard would expose two employees’ health categories and promotion outcomes.
  expected_response: Minimise collection, involve privacy expertise, aggregate/suppress appropriately and separate
    support from monitoring.
  boundary: Do not invent a universal anonymity threshold or infer disability from tool use.
  verification: Review reidentification risk and usefulness before any data collection or reporting.
  execution_status: not_run
  observed_result: null
- id: SC-17
  title: A task timing race
  guidance_ids:
  - IE-SYS-002
  workflow_id: W2
  prompt: A manager wants to time one disabled worker against the fastest colleague to set a capability score.
  expected_response: Reframe as voluntary system task analysis with context, repeated observations where useful,
    uncertainty and cumulative burden.
  boundary: No employee ranking, forced research or universal delay pass bands.
  verification: Test system changes against complete goals and acceptable privacy/effort.
  execution_status: not_run
  observed_result: null
- id: SC-18
  title: A missing upstream source
  guidance_ids:
  - IE-EVA-003
  workflow_id: W1
  prompt: An assistant is asked for a detailed rule from an unavailable Double FW repository.
  expected_response: State that the source was not retrieved, use verified applicable guidance and record the dependency
    gap.
  boundary: Do not invent source contents, assume privacy status or claim the collection was fully audited.
  verification: Resolve corrected source/access before asserting its requirements.
  execution_status: not_run
  observed_result: null
