- id: IE-PER-003
  title: Make formal procedures accessible
  authority_type: double_fw_method
  directive: should
  adoption_status: proposed
  audiences:
  - line_managers
  - hr
  - teams
  lifecycle_stages:
  - daily_work
  settings:
  - remote
  - hybrid
  - onsite
  jurisdiction: general_practice
  statement: Provide clear notice of the issue, relevant material, preparation time and accessible response methods.
    Agree formats, communication support, breaks and meeting arrangements. Explain the applicable accompaniment
    rights and consider whether another support person is needed as an adjustment or permitted by policy; these
    are distinct grounds.
  outcome: People can understand, participate in and challenge formal decisions.
  barriers:
  - formal-process
  owner_role: hr
  workflow_id: W3
  canonical_path: docs/08-performance.md#formal-process
  limitations: Detailed procedural entitlements depend on meeting type, status and jurisdiction; verify current
    law and policy.
