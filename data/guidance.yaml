  reviewer: null
- id: IE-CUL-002
  title: Make development and progression equitable
  authority_type: double_fw_method
  directive: should
  adoption_status: proposed
  audiences:
  - line_managers
  - hr
  - teams
  lifecycle_stages:
  - progression
  settings:
  - remote
  - hybrid
  - onsite
  jurisdiction: general_practice
  statement: Review access to stretch assignments, learning, mentoring, sponsorship, performance evidence and promotion
    panels. Publish criteria that reflect the work. Offer technical, specialist and other contribution routes alongside
    people management where the organisation supports them; do not assume every expert should manage staff to advance.
  outcome: People can grow, earn and lead without having to conform to one career style.
  barriers:
  - progression
  owner_role: hr
  workflow_id: W4
  canonical_path: docs/09-culture.md#progression
  limitations: Career paths must be resourced and published; do not promise a promotion route that has not been
    adopted.
  source_ids:
  - BRIEF
  verification: Review the intended outcome and practical arrangements with affected people; record limits and follow-up.
  review_status: draft
  reviewed_on: null
  review_due: null
  reviewer: null
- id: IE-CUL-003
  title: Solve shared problems without exposing a colleague
  authority_type: double_fw_method
  directive: should
  adoption_status: proposed
  audiences:
  - line_managers
  - hr
  - teams
  lifecycle_stages:
  - progression
  settings:
  - remote
  - hybrid
  - onsite
  jurisdiction: general_practice
  statement: Ask privately whether the affected person wants team input and what may be shared. Frame the challenge
    around the process, goal or activity. Explore alternatives, including changes that initially seem unfamiliar,
    and test whether they work. Do not make the colleague's disability the team-building puzzle.
  outcome: Teams can improve a process while respecting choice and independence.
  barriers:
  - team-solutions
  owner_role: line_manager
  workflow_id: W4
  canonical_path: docs/09-culture.md#team-solutions
  limitations: Permission to try a team solution is not permission to publish a personal story or medical information.
  source_ids:
  - BRIEF
  - DFW-17
  verification: Review the intended outcome and practical arrangements with affected people; record limits and follow-up.
  review_status: draft
  reviewed_on: null
  review_due: null
  reviewer: null
- id: IE-AI-001
  title: Explore optional AI support
  authority_type: double_fw_method
  directive: should
  adoption_status: proposed
  audiences:
  - line_managers
  - hr
  - teams
  lifecycle_stages:
  - daily_work
  settings:
  - remote
  - hybrid
  - onsite
  jurisdiction: general_practice
  statement: 'Start with a person-chosen task: organising instructions, drafting a summary, reformatting information
    or supporting an interaction through an authorised interface. Investigate whether AI reduces the actual barrier
    and effort. Provide an accessible non-AI route and make declining or stopping the trial consequence-free.'
  outcome: People can trial useful support with choice, privacy and a workable alternative.
  barriers:
  - optional-support
  owner_role: ai_service_owner
  workflow_id: W5
  canonical_path: docs/10-ai.md#optional-support
  limitations: AI is an option to evaluate, not a compulsory adjustment or a cure for an inaccessible service.
