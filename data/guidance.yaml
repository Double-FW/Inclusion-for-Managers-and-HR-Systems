- id: IE-CUL-001
  title: Practical awareness and respectful support
  authority_type: double_fw_method
  directive: should
  adoption_status: proposed
  audiences:
  - line_managers
  - hr
  - teams
  lifecycle_stages:
  - progression
  settings:
  - remote
  - hybrid
  - onsite
  jurisdiction: general_practice
  statement: Provide accessible, role-specific training in disability, Deaf awareness, neurodivergence, privacy,
    communication and responding to barriers. Use practical situations and refresh learning through normal work.
    Do not identify staff as teaching examples or require disclosure. Include paid lived-experience expertise with
    clear choice over participation and attribution.
  outcome: Inclusion is reinforced through everyday behaviour and accessible learning.
  barriers:
  - everyday-culture
  owner_role: line_manager
  workflow_id: W4
  canonical_path: docs/09-culture.md#everyday-culture
  limitations: Training, networks and voluntary inclusion schemes support capability but do not prove compliance
    or replace operational change.
  source_ids:
  - BRIEF
  - DFW-17
  verification: Review the intended outcome and practical arrangements with affected people; record limits and follow-up.
  review_status: draft
