- id: IE-AI-002
  title: Bound agent actions and employment decisions
  authority_type: organisational_policy
  directive: must
  adoption_status: proposed
  audiences:
  - line_managers
  - hr
  - teams
  lifecycle_stages:
  - daily_work
  settings:
  - remote
  - hybrid
  - onsite
  jurisdiction: general_practice
  statement: Begin with read-only access where appropriate. Grant action permissions only for a defined task with
    an authorised user, minimum access, clear confirmation points, logging and recovery. Separate drafting from
    sending, editing from approving, and suggesting from making a consequential decision. Check the interface remains
    usable with the person's assistive technology.
  outcome: Automation supports people without profiling or deciding their employment outcomes.
  barriers:
  - agent-boundaries
  owner_role: ai_service_owner
  workflow_id: W5
  canonical_path: docs/10-ai.md#agent-boundaries
  limitations: These are repository governance boundaries, not a claim that every prohibition is a verbatim statutory
    rule.
  source_ids:
  - BRIEF
  - L10
  verification: Review the intended outcome and practical arrangements with affected people; record limits and follow-up.
  review_status: draft
  reviewed_on: null
  review_due: null
  reviewer: null
- id: IE-EVA-001
  title: Measure the experience and the response
  authority_type: double_fw_method
  directive: should
  adoption_status: proposed
  audiences:
  - line_managers
  - hr
  - teams
  lifecycle_stages:
  - daily_work
  settings:
  - remote
  - hybrid
  - onsite
  jurisdiction: general_practice
  statement: Track adjustment acknowledgement and implementation, whether support works for the person, recurring
    barriers and unresolved access to essential services. Include independence, effort, errors, fatigue, confidence,
    satisfaction, belonging, learning and progression. Training completion, scheme membership and equipment purchases
    describe activity; they do not prove outcomes.
  outcome: Improvement reflects actual participation rather than activity counts.
  barriers:
  - outcomes
  owner_role: knowledge_base_owner
  workflow_id: W1
  canonical_path: docs/11-evaluation.md#outcomes
  limitations: Small samples and self-selection limit conclusions; avoid unsupported causal claims or universal
    timing tolerances.
  source_ids:
  - BRIEF
  - DFW-10
  - DFW-11
  verification: Review the intended outcome and practical arrangements with affected people; record limits and follow-up.
  review_status: draft
  reviewed_on: null
  review_due: null
  reviewer: null
- id: IE-EVA-002
  title: Collect less and protect meaning
  authority_type: double_fw_method
  directive: should
  adoption_status: proposed
  audiences:
  - line_managers
  - hr
  - teams
  lifecycle_stages:
  - daily_work
  settings:
  - remote
  - hybrid
  - onsite
  jurisdiction: general_practice
  statement: Separate confidential support records from optional equality monitoring. Determine lawful purpose,
    necessary data, access controls, retention and relevant health-data conditions before collection. Agreement
    about a meeting preference does not automatically authorise all health-data processing. Do not infer disability
    from use of assistive technology or a particular tool.
  outcome: Learning does not create intrusive employment or disability profiles.
  barriers:
  - data-ethics
  owner_role: privacy_owner
  workflow_id: W1
  canonical_path: docs/11-evaluation.md#data-ethics
  limitations: The knowledge base provides synthetic structures, not authority or infrastructure to process employee
    cases.
  source_ids:
  - BRIEF
  - DFW-07
  - L7
  verification: Review the intended outcome and practical arrangements with affected people; record limits and follow-up.
