id: W5
title: Trial AI as optional support
trigger: A person chooses to explore AI for a defined work barrier.
owner_role: ai_service_owner
inputs:
- Person-chosen goal and accessible non-AI alternative
- Approved product, minimum data and permission scope
- Success, failure, review and rollback criteria
interim_support: Maintain accessible support and urgent safety routes while the process runs.
steps:
- id: scope
  title: Define an optional trial
  owner_role: line_manager
  action: Agree task, benefit, duration and ability to decline or stop without penalty.
  evidence: A specific goal and non-AI support remain available.
  next_step: assess
- id: assess
  title: Review product and data
  owner_role: privacy_owner
  action: Check accessible interface, data flows, security, retention, procurement and minimum necessary information.
  evidence: Approved scope using synthetic or authorised minimum data.
  next_step: permissions
- id: permissions
  title: Bound actions
  owner_role: ai_service_owner
  action: Use read-only access first where suitable; require explicit authority for actions with logs and recovery.
  evidence: Permissions distinguish drafting, sending and approving.
  next_step: trial
- id: trial
  title: Run and verify
  owner_role: ai_service_owner
  action: Verify summaries, transcription and actions against sources; assess accuracy, access, effort, privacy
    and control.
  evidence: Observed benefit and errors; no unsupported success claim.
  next_step: decide
- id: decide
  title: Stop, adjust or continue
  owner_role: line_manager
  action: Review with the participant. Stop on exposure, unverified action, ineffective support or withdrawal. Restore
    the accessible alternative.
  evidence: Decision and next review recorded without profiling.
  next_step: null
escalation: Escalate data exposure to security/privacy and employment decisions to authorised HR/hiring owners.
  Do not let an agent approve its own expansion of scope.
boundaries:
- No diagnosis, masking, emotion or personality inference; no autonomous hiring, disciplinary, promotion or adjustment-refusal
  decision.
review: Agree a review date, check the outcome with the affected person, and reopen ineffective arrangements.
closure: Record the outcome, remaining work, continuing support and accessible challenge route. No automatic closure
  on equipment purchase or form completion.
canonical_path: workflows/ai-trials.md
template_paths:
- templates/ai-trial.md
status: draft
execution_mode: human_decision_support_only
decisions:
- at_step: assess
  condition: Service or data use not approved
  next_step: escalate
  requires_role: privacy_owner
  evidence: Human decision and reasons recorded privately; maintain practical support and applicable challenge route.
- at_step: trial
  condition: Exposure, unverifiable action or participant withdraws
  next_step: decide
  requires_role: ai_service_owner
  evidence: Human decision and reasons recorded privately; maintain practical support and applicable challenge route.
- at_step: decide
  condition: Continue proposed beyond original scope
  next_step: assess
  requires_role: ai_service_owner
  evidence: Human decision and reasons recorded privately; maintain practical support and applicable challenge route.
