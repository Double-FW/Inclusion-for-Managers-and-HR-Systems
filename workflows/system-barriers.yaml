id: W2
title: Investigate an inaccessible system or benefit
trigger: Someone cannot achieve a work or benefit goal, or an audit identifies exclusion.
owner_role: service_owner
inputs:
- Goal and failed task; environment and interaction method
- Impact, frequency and confidentiality needs
- Reproduction evidence using synthetic data
interim_support: Preserve confidentiality and timeliness. Do not assume a colleague handling private data is acceptable.
steps:
- id: capture
  title: Capture the barrier
  owner_role: service_owner
  action: Record observable failure with minimum data and a reproducible task; recognise urgent pay, health or safety
    impacts.
  evidence: Goal, impact and affected route understood.
  next_step: interim
- id: interim
  title: Provide an effective interim route
  owner_role: service_owner
  action: Preserve confidentiality and timeliness. Do not assume a colleague handling private data is acceptable.
  evidence: Person can access the essential service while repair continues.
  next_step: route
- id: route
  title: Route responsibility
  owner_role: procurement_owner
  action: 'Internal: product/engineering owner. Supplier: procurement/vendor management plus service owner. Benefits:
    commissioning HR owner.'
  evidence: Named delivery owner and update date.
  next_step: investigate
- id: investigate
  title: Investigate the task
  owner_role: accessibility_lead
  action: Use representative walkthroughs and voluntary observation; evaluate effort, time, errors and recovery
    with uncertainty and no employee ranking.
  evidence: Task evidence and cumulative burden, not individual ability scores.
  next_step: remediate
- id: remediate
  title: Agree and deliver repair
  owner_role: service_owner
  action: Record fix plan, supplier dependencies and interim access. Procurement/legal own contractual remedies
    and payment decisions.
  evidence: Repair and verification plan agreed; no unauthorised payment threat.
  next_step: verify
- id: verify
  title: Verify the full goal
  owner_role: accessibility_lead
  action: Retest the affected workflow and assistive technology, including authentication, support and exports;
    obtain user feedback.
  evidence: Close only after the intended service is usable; reopen regressions.
  next_step: null
escalation: Escalate prolonged or severe exclusion to service leadership and HR; procurement/legal assess contract
  remedies. Do not wait for exhaustive measurement before providing urgent access.
boundaries:
- No automatic finding of discrimination or breach; no managerial or agentic withholding of payment.
review: Agree a review date, check the outcome with the affected person, and reopen ineffective arrangements.
closure: Record the outcome, remaining work, continuing support and accessible challenge route. No automatic closure
  on equipment purchase or form completion.
canonical_path: workflows/system-barriers.md
template_paths:
- templates/supplier-issue.md
- templates/task-analysis.md
status: draft
execution_mode: human_decision_support_only
decisions:
- at_step: interim
  condition: No confidential timely interim service is available
  next_step: escalate
  requires_role: service_owner
  evidence: Human decision and reasons recorded privately; maintain practical support and applicable challenge route.
- at_step: remediate
  condition: Contract remedy or payment decision is proposed
  next_step: escalate
  requires_role: procurement_owner
  evidence: Human decision and reasons recorded privately; maintain practical support and applicable challenge route.
- at_step: verify
  condition: Full workflow still fails
  next_step: investigate
  requires_role: accessibility_lead
  evidence: Human decision and reasons recorded privately; maintain practical support and applicable challenge route.
