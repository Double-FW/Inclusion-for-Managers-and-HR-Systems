id: W4
title: Explore a shared team solution
trigger: A shared process or activity creates an access barrier.
owner_role: line_manager
inputs:
- Person’s private preference about team involvement
- Task goal and permitted sharing
- Competing access needs and workload impacts
interim_support: Maintain accessible support and urgent safety routes while the process runs.
steps:
- id: permission
  title: Agree involvement privately
  owner_role: line_manager
  action: Ask whether collaboration would help and what may be shared. Provide an individual route if team involvement
    is declined.
  evidence: Free choice and sharing boundaries.
  next_step: frame
- id: frame
  title: Frame the process challenge
  owner_role: meeting_organiser
  action: Describe the goal and barrier without identifying someone’s condition.
  evidence: An accessible, task-centred problem statement.
  next_step: options
- id: options
  title: Explore alternatives
  owner_role: line_manager
  action: Consider redesign and independent routes first. Optional buddying needs privacy, workload and an exit
    route.
  evidence: Options including refusal of help without penalty.
  next_step: trial
- id: trial
  title: Try and test
  owner_role: process_owner
  action: Evaluate real participation with affected people, including conflicting needs; stop ineffective or exposing
    solutions.
  evidence: Evidence of access, effort, dignity and remaining issues.
  next_step: learn
- id: learn
  title: Review and share process learning
  owner_role: line_manager
  action: Share anonymised learning only within agreed boundaries; keep the permanent fix owned and funded.
  evidence: Review date and a transferable process account, not a personal story.
  next_step: null
escalation: Escalate inaccessible activity design to its owner and persistent exclusion to leadership; do not make
  the affected colleague responsible for entertaining or educating the team.
boundaries:
- Buddying is voluntary assistance, not an automatic substitute for independent access.
review: Agree a review date, check the outcome with the affected person, and reopen ineffective arrangements.
closure: Record the outcome, remaining work, continuing support and accessible challenge route. No automatic closure
  on equipment purchase or form completion.
canonical_path: workflows/team-solutions.md
template_paths:
- templates/team-solution.md
- templates/anonymised-learning.md
status: draft
execution_mode: human_decision_support_only
decisions:
- at_step: permission
  condition: Person declines team involvement
  next_step: escalate
  requires_role: line_manager
  evidence: Human decision and reasons recorded privately; maintain practical support and applicable challenge route.
- at_step: trial
  condition: Solution exposes private information or removes choice
  next_step: options
  requires_role: line_manager
  evidence: Human decision and reasons recorded privately; maintain practical support and applicable challenge route.
- at_step: learn
  condition: Sharing permission not given
  next_step: close
  requires_role: line_manager
  evidence: Human decision and reasons recorded privately; maintain practical support and applicable challenge route.
